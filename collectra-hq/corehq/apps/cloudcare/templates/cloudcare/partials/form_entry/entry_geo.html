{% load i18n %}

<script type="text/html" id="geo-entry-ko-template">
  <table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tbody>
    <tr>
      <td class="lat coordinate" data-bind="text: formatLat()"></td>
      <td class="lon coordinate" data-bind="text: formatLon()"></td>
      <td align="right" valign="bottom">
        <button type="button" class="btn btn-outline-primary btn-sm clear" data-bind="click: onClear">{% trans "Clear location" %}</button>
      </td>
    </tr>
    </tbody>
  </table>
  <div class="map" data-bind="
    visible: mapAvailable,
    attr: {
      'id': entryId,
      'aria-labelledby': entryId + '-label',
    }">
    <div class="wait" data-bind="visible: !hasMap()" >{% trans "Please wait while the map loads" %}</div>
  </div>
  <div data-bind="visible: mapAvailable">
    <form data-bind="submit: search">
      <div class="mt-1" data-bind="css: control_width">
        <div class="input-group">
          <input class="query form-control"
                 type="text"
                 data-bind="css: { 'is-invalid': $parent.hasError() }"
          />
          <button class="btn btn-outline-primary search">{% trans "Search" %}</button>
        </div>
      </div>
    </form>
  </div>
  <p class="small text-muted mt-2" data-bind="visible: mapNotice, text: mapNotice"></p>
  <button type="button" class="btn btn-outline-primary btn-sm mt-2"
          data-bind="click: captureLocation, disable: locating, attr: { 'aria-busy': locating }">
    {% trans "Use my current location" %}
  </button>
  <span class="small" role="status" data-bind="visible: locating">{% trans "Getting location…" %}</span>
  <p class="small text-muted mt-2">{% trans "Use current location only when you are at the farm or site. Otherwise enter its coordinates." %}</p>
  <div class="row mt-2">
    <div class="col-6">
      <label data-bind="attr: { for: entryId + '-latitude' }">{% trans "Latitude" %}</label>
      <input type="number" min="-90" max="90" step="any" class="form-control"
             data-bind="value: latitude, attr: { id: entryId + '-latitude' }" />
    </div>
    <div class="col-6">
      <label data-bind="attr: { for: entryId + '-longitude' }">{% trans "Longitude" %}</label>
      <input type="number" min="-180" max="180" step="any" class="form-control"
             data-bind="value: longitude, attr: { id: entryId + '-longitude' }" />
    </div>
  </div>
  <button type="button" class="btn btn-outline-primary btn-sm mt-2" data-bind="click: saveCoordinates">
    {% trans "Use these coordinates" %}
  </button>
  <p class="small text-danger mt-2" role="alert" data-bind="visible: locationError, text: locationError"></p>
</script>
