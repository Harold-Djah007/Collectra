{% load i18n %}

<script type="text/html" id="geo-entry-ko-template">
  <div class="border rounded overflow-hidden" style="background:#fff;box-shadow:0 3px 12px #173e5810">
    <div class="d-flex justify-content-between align-items-center p-2" style="background:#edf9f8">
      <strong class="small">{% trans "Choose the farm location" %}</strong>
      <button type="button" class="btn btn-outline-primary btn-sm" data-bind="click: onClear">{% trans "Clear" %}</button>
    </div>
    <div class="map" style="margin:0;border:0" data-bind="
      visible: mapAvailable,
      style: { height: mapExpanded() ? '420px' : '260px' },
      attr: { id: entryId, 'aria-labelledby': entryId + '-label' }">
    </div>
    <div class="d-flex justify-content-between align-items-center px-2 py-2 border-top">
      <span class="small">
        <span data-bind="text: formatLat()"></span> · <span data-bind="text: formatLon()"></span>
      </span>
      <button type="button" class="btn btn-outline-primary btn-sm" data-bind="visible: mapAvailable, click: toggleMapSize, attr: { 'aria-expanded': mapExpanded }">
        <span data-bind="visible: !mapExpanded()">{% trans "Larger map" %}</span>
        <span data-bind="visible: mapExpanded">{% trans "Smaller map" %}</span>
      </button>
    </div>
  </div>
  <p class="small text-muted mt-2" data-bind="visible: mapAvailable">{% trans "Tap the farm on the map. Drag the pin to fine-tune its position." %}</p>
  <div data-bind="visible: searchAvailable">
    <form data-bind="submit: search">
      <div class="mt-1" data-bind="css: control_width">
        <div class="input-group">
          <input class="query form-control"
                 type="text"
                 data-bind="css: { 'is-invalid': $parent.hasError() }"
          />
          <button class="btn btn-outline-primary search">{% trans "Search" %}</button>
        </div>
      </div>
    </form>
  </div>
  <p class="small text-muted mt-2" data-bind="visible: mapNotice, text: mapNotice"></p>
  <button type="button" class="btn btn-outline-primary btn-sm mt-2"
          data-bind="click: captureLocation, disable: locating, attr: { 'aria-busy': locating }">
    {% trans "Use my current location" %}
  </button>
  <span class="small" role="status" data-bind="visible: locating">{% trans "Getting location…" %}</span>
  <p class="small text-muted mt-2">{% trans "Use current location only when you are at the farm or site. Otherwise enter its coordinates." %}</p>
  <details class="border rounded p-2 mt-2">
    <summary class="small" style="cursor:pointer">{% trans "Enter coordinates" %}</summary>
  <div class="row mt-2">
    <div class="col-6">
      <label data-bind="attr: { for: entryId + '-latitude' }">{% trans "Latitude" %}</label>
      <input type="number" min="-90" max="90" step="any" class="form-control"
             data-bind="value: latitude, attr: { id: entryId + '-latitude' }" />
    </div>
    <div class="col-6">
      <label data-bind="attr: { for: entryId + '-longitude' }">{% trans "Longitude" %}</label>
      <input type="number" min="-180" max="180" step="any" class="form-control"
             data-bind="value: longitude, attr: { id: entryId + '-longitude' }" />
    </div>
  </div>
  <button type="button" class="btn btn-outline-primary btn-sm mt-2" data-bind="click: saveCoordinates">
    {% trans "Use these coordinates" %}
  </button>
  </details>
  <p class="small text-danger mt-2" role="alert" data-bind="visible: locationError, text: locationError"></p>
</script>
