{% load i18n %}
{% load hq_shared_tags %}
<footer>
  <nav
    id="hq-footer"
    role="navigation"
    class="navbar navbar-dark bg-dark navbar-expand navbar-hq-footer"
  >
    <div class="container-fluid">
      <p class="text-center align-middle mb-0 w-100">
        <a href="{% url "homepage" %}" class="footer-link-img">
          <img
            src="{% static 'hqwebapp/images/collectra-logo-footer.svg' %}"
            alt="Collectra"
            height="30"
          />
        </a>
        &nbsp;
        {% blocktrans %}
          Collectra &copy;
        {% endblocktrans %}{% now "Y" %}
        &nbsp;{% trans "Built on CommCare HQ." %}

        <span class="d-inline-md d-inline-lg">&nbsp;|&nbsp;</span>
        <a href="https://dimagi.com/terms/latest/privacy/" target="_blank">
          {% trans "Privacy" %}
        </a>
        &nbsp;|&nbsp;
        <a href="https://dimagi.com/terms/latest/tos/" target="_blank">
          {% trans "Terms of Service" %}
        </a>
        &nbsp;|&nbsp;
        <a href="https://dimagi.com/terms/latest/ba/" target="_blank">
          {% trans "Business Agreement" %}
        </a>
      </p>
    </div>
  </nav>
</footer>
