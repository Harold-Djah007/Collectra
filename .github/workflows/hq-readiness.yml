name: Collectra HQ readiness

on:
  pull_request:
    paths:
      - "collectra-hq/**"
      - "deploy/local-testing/**"
      - ".github/workflows/hq-readiness.yml"
  push:
    branches: [main, hd/safisana-form-workflows-2026-09-24]
    paths:
      - "collectra-hq/**"
      - "deploy/local-testing/**"
      - ".github/workflows/hq-readiness.yml"

permissions:
  contents: read

concurrency:
  group: hq-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hq-python:
    name: HQ Python quality
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: commcarehq
          POSTGRES_USER: commcarehq
          POSTGRES_PASSWORD: commcarehq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commcarehq -d commcarehq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      couchdb:
        image: apache/couchdb:3.5.0
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: commcarehq
        ports:
          - 5984:5984
        options: >-
          --health-cmd "bash -c 'exec 6<>/dev/tcp/127.0.0.1/5984'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      zookeeper:
        image: zookeeper:3.7
        env:
          JVMFLAGS: -Xms128m -Xmx256m
      kafka:
        image: confluentinc/cp-kafka:7.2.14
        env:
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_BROKER_ID: "1"
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
        ports:
          - 9092:9092
        options: >-
          --health-cmd "cub kafka-ready -b 127.0.0.1:9092 1 10"
          --health-interval 10s
          --health-timeout 15s
          --health-retries 15
          --health-start-period 30s
    defaults:
      run:
        working-directory: collectra-hq
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "collectra-hq/uv.lock"

      - name: Install Python dependencies
        run: uv sync --frozen --compile-bytecode

      - name: Start CommCare-compatible Elasticsearch
        run: |
          docker build \
            --tag collectra-elasticsearch6-ci \
            --file docker/files/Dockerfile.es.6 \
            docker

          docker run --detach \
            --name collectra-elasticsearch6-ci \
            --publish 9200:9200 \
            --env discovery.type=single-node \
            --env ES_JAVA_OPTS="-Xms512m -Xmx512m" \
            collectra-elasticsearch6-ci

          for attempt in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:9200/_cluster/health \
              >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs collectra-elasticsearch6-ci
          exit 1

      - name: Lint Collectra HQ changes
        run: |
          uv run ruff check \
            corehq/apps/hqmedia/audit.py \
            corehq/apps/hqmedia/management/commands/audit_app_multimedia.py \
            corehq/apps/hqmedia/management/commands/apply_menu_icon_manifest.py \
            corehq/apps/hqmedia/management/commands/export_menu_icon_inventory.py \
            corehq/apps/hqmedia/tests/test_audit.py \
            corehq/apps/hqmedia/tests/test_apply_menu_icon_manifest.py \
            corehq/apps/hqmedia/tests/test_export_menu_icon_inventory.py \
            corehq/apps/app_manager/models/install_codes.py \
            corehq/apps/app_manager/views/install_codes.py \
            corehq/apps/app_manager/tests/test_install_codes.py \
            deployment/production/localsettings.py

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply database migrations
        env:
          CCHQ_IS_FRESH_INSTALL: "1"
        run: uv run python manage.py migrate --noinput --no-reindex

      - name: Initialize Kafka topics for form-backed fixtures
        run: uv run python manage.py create_kafka_topics

      - name: Run focused HQ tests
        run: |
          if [ ! -e "$GITHUB_WORKSPACE/collectra-hq/.git" ]; then
            ln -s "$GITHUB_WORKSPACE/.git" "$GITHUB_WORKSPACE/collectra-hq/.git"
          fi
          uv run pytest --nomigrations \
            corehq/apps/hqmedia/tests/test_audit.py \
            corehq/apps/hqmedia/tests/test_apply_menu_icon_manifest.py \
            corehq/apps/hqmedia/tests/test_export_menu_icon_inventory.py \
            corehq/apps/app_manager/tests/test_install_codes.py \
            corehq/apps/app_manager/tests/test_excel_form_builder.py \
            corehq/apps/app_manager/tests/test_xlsform_metadata.py \
            corehq/apps/app_manager/tests/test_form_readiness.py \
            corehq/apps/app_manager/tests/test_check_hq_form_readiness.py \
            corehq/apps/app_manager/tests/test_audit_safisana_upgrade.py \
            corehq/apps/app_manager/tests/test_restore_form_xml_cache.py \
            corehq/apps/app_manager/tests/test_stage_safisana_batch_names.py \
            corehq/apps/app_manager/tests/test_stage_safisana_incident_google_form.py \
            corehq/apps/app_manager/tests/test_repair_safisana_operational_questions.py \
            corehq/apps/app_manager/tests/test_stage_safisana_close_only.py \
            corehq/apps/app_manager/tests/test_reconcile_safisana_reopen_request.py \
            corehq/apps/dashboard/tests/test_dashboard_permissions.py \
            corehq/apps/dashboard/tests/test_operational_alerts.py \
            corehq/apps/dashboard/tests/test_reopen_requests.py \
            corehq/motech/tests/test_auth.py \
            corehq/apps/receiverwrapper/tests/test_auth.py \
            corehq/apps/api/tests/test_auth.py \
            corehq/blobs/tests/test_blob_import.py \
            corehq/apps/dump_reload/tests/test_sql_data_loader.py \
            corehq/tests/test_security_dependency_guards.py

      - name: Check Django configuration
        run: uv run python manage.py check --deploy

  hq-assets:
    name: HQ production assets
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: collectra-hq
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: collectra-hq/yarn.lock

      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Build production browser assets
        run: yarn build

  local-origin:
    name: Local optimized-origin validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell entry point
        run: |
          bash -n deploy/local-testing/start-optimized-origin.sh
          bash -n collectra-hq/local-bin/start-collectra
          python3 -m unittest discover -s deploy/local-testing/tests -p 'test_*.py' -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check dashboard, XLSForm preview and GPS behavior
        run: |
          node deploy/local-testing/test-dashboard-loading.cjs
          node deploy/local-testing/test-xlsform-preview.cjs
          node deploy/local-testing/test-gps-entry.cjs

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -v "$PWD/deploy/local-testing/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.8.4-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
