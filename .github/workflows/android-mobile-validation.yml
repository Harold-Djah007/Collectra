name: Collectra Mobile validation

on:
  pull_request:
    paths:
      - "commcare-android/**"
      - ".github/workflows/android-mobile-validation.yml"
  push:
    branches: [main]
    paths:
      - "commcare-android/**"
      - ".github/workflows/android-mobile-validation.yml"

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Collectra presentation and CommCare compatibility tests
        working-directory: commcare-android
        run: |
          bash ./gradlew \
            :app:testCommcareDebugUnitTest \
            --tests org.commcare.network.AppListEndpointProviderTest \
            --tests org.commcare.network.AppInstallCodeResolverTest \
            --tests org.commcare.utils.ConnectivityStatusTest \
            --tests org.commcare.activities.CollectraMobilePresentationTest \
            --no-daemon

      - name: Build Collectra debug APK
        working-directory: commcare-android
        run: bash ./gradlew :app:assembleCommcareDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Collectra-debug
          path: commcare-android/app/build/outputs/apk/commcare/debug/app-commcare-debug.apk
          if-no-files-found: error
