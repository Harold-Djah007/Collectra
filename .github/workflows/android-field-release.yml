name: Collectra Android field release

on:
  workflow_dispatch:
    inputs:
      collectra_hq_base_url:
        description: Permanent HTTPS Collectra HQ origin
        required: true
        type: string
      version_code:
        description: Increasing Android integer version code
        required: true
        type: string
      version_name:
        description: Human-readable release version
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch
        run: echo "Android field release dispatch accepted"
