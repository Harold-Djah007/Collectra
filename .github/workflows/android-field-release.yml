name: Collectra Android field release

on:
  workflow_dispatch:
    inputs:
      collectra_hq_base_url:
        description: Permanent HTTPS Collectra HQ origin
        required: true
        type: string
      version_code:
        description: Increasing Android integer version code
        required: true
        type: number
      version_name:
        description: Human-readable release version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: collectra-android-field-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COLLECTRA_HQ_BASE_URL: ${{ inputs.collectra_hq_base_url }}
      COLLECTRA_VERSION_CODE: ${{ inputs.version_code }}
      COLLECTRA_VERSION_NAME: ${{ inputs.version_name }}
      KEYSTORE_PATH: ${{ runner.temp }}/collectra-release.jks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate release inputs and signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.COLLECTRA_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.COLLECTRA_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COLLECTRA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.COLLECTRA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ ! "$COLLECTRA_HQ_BASE_URL" =~ ^https://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?/?$ ]]; then
            echo "collectra_hq_base_url must be a permanent HTTPS origin without a port or path."
            exit 1
          fi
          if (( COLLECTRA_VERSION_CODE <= 1 )); then
            echo "version_code must be greater than 1 and higher than the previous field release."
            exit 1
          fi
          for value in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Required signing secret is missing: ${value}"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 0600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Run unit tests
        working-directory: commcare-android
        run: bash ./gradlew :app:testCommcareDebugUnitTest --no-daemon --stacktrace

      - name: Run release lint
        working-directory: commcare-android
        run: bash ./gradlew :app:lintCommcareRelease --no-daemon --stacktrace

      - name: Build signed field APK
        working-directory: commcare-android
        env:
          STORE_PASSWORD: ${{ secrets.COLLECTRA_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COLLECTRA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.COLLECTRA_ANDROID_KEY_PASSWORD }}
        run: |
          bash ./gradlew :app:assembleCommcareRelease             -PCOLLECTRA_HQ_BASE_URL="$COLLECTRA_HQ_BASE_URL"             -PversionCode="$COLLECTRA_VERSION_CODE"             -PversionName="$COLLECTRA_VERSION_NAME"             -PRELEASE_STORE_FILE="$KEYSTORE_PATH"             -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD"             -PRELEASE_KEY_ALIAS="$KEY_ALIAS"             -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"             --no-daemon             --stacktrace

      - name: Package and verify field release
        shell: bash
        run: |
          set -euo pipefail
          apk="commcare-android/app/build/outputs/apk/commcare/release/app-commcare-release.apk"
          test -s "$apk"
          mkdir -p field-release
          cp "$apk" "field-release/Collectra-field-v${COLLECTRA_VERSION_NAME}.apk"
          keytool -printcert -jarfile "$apk" > field-release/signing-certificate.txt
          printf 'commit=%s\ncollectra_hq_base_url=%s\nversion_code=%s\nversion_name=%s\nbuilt_utc=%s\n'             "$GITHUB_SHA" "$COLLECTRA_HQ_BASE_URL" "$COLLECTRA_VERSION_CODE"             "$COLLECTRA_VERSION_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             > field-release/build-metadata.txt
          (
            cd field-release
            sha256sum "Collectra-field-v${COLLECTRA_VERSION_NAME}.apk" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: Collectra-field-v${{ inputs.version_name }}
          path: field-release/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$KEYSTORE_PATH"
