name: Production deployment validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/production/**"
      - "collectra-hq/deployment/production/**"
      - "collectra-hq/Dockerfile_incl"
      - "collectra-hq/.dockerignore"
      - "collectra-hq/corehq/blobs/**"
      - "collectra-hq/corehq/ex-submodules/dimagi/utils/gitinfo.py"
      - "collectra-hq/pyproject.toml"
      - "collectra-hq/uv.lock"
      - "collectra-hq/webpack/**"
      - ".github/workflows/production-deployment.yml"
  push:
    branches: [main]
    paths:
      - "deploy/production/**"
      - "collectra-hq/deployment/production/**"
      - "collectra-hq/Dockerfile_incl"
      - "collectra-hq/.dockerignore"
      - "collectra-hq/corehq/blobs/**"
      - "collectra-hq/corehq/ex-submodules/dimagi/utils/gitinfo.py"
      - "collectra-hq/pyproject.toml"
      - "collectra-hq/uv.lock"
      - "collectra-hq/webpack/**"
      - ".github/workflows/production-deployment.yml"

permissions:
  contents: read

concurrency:
  group: production-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare validation environment
        run: cp deploy/production/.env.example deploy/production/.env

      - name: Validate shell scripts
        run: |
          for script in deploy/production/*.sh; do
            bash -n "$script"
          done

      - name: Validate Python configuration syntax
        run: python -m py_compile collectra-hq/deployment/production/localsettings.py

      - name: Check production email settings
        working-directory: collectra-hq
        run: python -m unittest discover -s deployment/production/tests -p 'test_*.py'

      - name: Validate Docker Compose configuration
        working-directory: deploy/production
        run: docker compose config --quiet

      - name: Validate Caddy configuration
        working-directory: deploy/production
        run: >-
          docker run --rm
          --env-file .env
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.8.4-alpine
          caddy validate --config /etc/caddy/Caddyfile

  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: collectra-hq
          file: collectra-hq/Dockerfile_incl
          tags: collectra-hq:validation
          load: true
          cache-from: type=gha,scope=collectra-production
          cache-to: type=gha,mode=max,scope=collectra-production
      - name: Smoke-test the non-root runtime and compiled assets
        run: >-
          docker run --rm collectra-hq:validation
          uv run python deployment/production/image_smoke.py
